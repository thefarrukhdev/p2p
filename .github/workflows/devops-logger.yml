name: DevOps Telegram Logger

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, closed, reopened]
  deployment_status:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_LOGGER_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_LOGGER_CHAT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 .github/scripts/telegram_notify.py
