name: CI

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/render-runtime-repair
  workflow_dispatch:

jobs:
  backend:
    name: Backend CI (Python 3.11 & Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 26379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://127.0.0.1:26379/0"
      CELERY_BROKER_URL: "redis://127.0.0.1:26379/1"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:26379/2"
      TELEGRAM_BOT_TOKEN: "123456789:mock-test-token-safe"
      SECRET_KEY: "test-secret-key-safe-dummy-32bytes-min"
      JWT_SECRET_KEY: "test-jwt-secret-key-safe-dummy-32bytes"
      FERNET_KEY: "cw_2n_8lQcQ5Ea0P6dYpY_5C2M7U7xX7dD6gK1mN3v4="
      ENVIRONMENT: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite

      - name: Verify Python Syntax Compilation
        run: |
          python -m compileall -q .

      - name: Run Backend Unit & Redis Integration Tests
        run: |
          python -m unittest discover tests -v

      - name: Run start.sh 10-Scenario Regression Test Suite
        run: |
          chmod +x tests/test_start_script.sh
          tests/test_start_script.sh

  frontend:
    name: Frontend CI (Node 20, Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests (Routing & Telemetry)
        run: npm test

      - name: Lint Check (Typecheck)
        run: npm run lint

      - name: Build Production Assets
        run: npm run build
